<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Garden — Fracture Orbit</title>
  <meta
    name="description"
    content="A strange generative loop where drifting nodes fracture into bright seams and pointer motion keeps the whole field alive."
  />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07060f;
      --panel: #171132;
      --ink: #eff2ff;
      --soft: #bed2ff;
      --line: #79fff2;
      --accent: #ff8eff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, #251a49 0%, #0e0d20 52%, var(--bg) 100%);
      color: var(--ink);
      font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      inset: 0.8rem;
      z-index: 2;
      pointer-events: none;
      display: grid;
      gap: 0.55rem;
      max-width: min(1220px, calc(100vw - 1.5rem));
      margin: 0 auto;
    }

    .panel,
    .note {
      pointer-events: auto;
      border: 1px solid #45368c;
      border-radius: 0.85rem;
      background: color-mix(in oklab, var(--panel), #000 26%);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      padding: 0.5rem 0.65rem;
    }

    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    .label {
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #c8d8ff;
      font-size: 0.72rem;
      margin-bottom: 0.1rem;
    }

    button,
    a,
    input {
      border: 1px solid #5e4bb5;
      border-radius: 999px;
      background: #1a1143;
      color: var(--ink);
      font: inherit;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.72rem;
      min-height: 30px;
      padding: 0.34rem 0.72rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    button:hover,
    a:hover {
      border-color: #95ffff;
      color: #ffffff;
    }

    button[aria-pressed='true'] {
      border-color: #95ffc0;
      color: #eafff0;
      box-shadow: inset 0 0 0 1px rgba(149, 255, 192, 0.32);
    }

    .status {
      margin-left: auto;
      max-width: 58ch;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.7rem;
      color: #d6ddff;
      opacity: 0.96;
    }

    .home {
      margin-left: auto;
    }

    label {
      display: inline-flex;
      gap: 0.35rem;
      align-items: center;
      color: #d7e4ff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.68rem;
    }

    input[type='range'] {
      width: 145px;
      accent-color: var(--line);
    }

    .note {
      color: #ced8ff;
      border-style: dashed;
      max-width: min(980px, calc(100vw - 1.5rem));
      line-height: 1.45;
      font-size: 0.72rem;
    }

    @media (max-width: 780px) {
      .panel {
        gap: 0.35rem;
      }

      .status {
        margin-left: 0;
        width: 100%;
      }

      input[type='range'] {
        width: 95px;
      }
    }
  </style>
</head>
<body>
  <canvas id="orbitCanvas" aria-label="Fracture Orbit canvas"></canvas>

  <div class="hud" aria-live="polite">
    <div class="panel">
      <span class="label">fracture orbit</span>
      <button id="seedBtn" type="button">new seed</button>
      <button id="modeBtn" type="button">mode: orbit</button>
      <button id="fractureBtn" type="button" aria-pressed="false">fracture seams: off</button>
      <button id="burstBtn" type="button">drop burst</button>
      <button id="pauseBtn" type="button" aria-pressed="false">pause: off</button>
      <button id="copyBtn" type="button">copy share link</button>
      <button id="exportBtn" type="button">export PNG</button>
      <button id="clearBtn" type="button">clear field</button>
      <label for="speedRange">speed <span id="speedLabel">1.05</span></label>
      <input id="speedRange" name="speedRange" type="range" min="0.42" max="2.3" step="0.04" value="1.05" />
      <label for="shearRange">shear <span id="shearLabel">1.30</span></label>
      <input id="shearRange" name="shearRange" type="range" min="0.45" max="3" step="0.05" value="1.3" />
      <a class="home" href="../" aria-label="Return to Signal Garden home">return home</a>
      <span class="status" id="status">initializing</span>
    </div>
    <p class="note" id="note">Click or touch to drop orbit fragments; move the pointer to bend them. The scene is deterministic from URL state and can be exported as PNG or copied as a replayable link.</p>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('orbitCanvas');
      const ctx = canvas.getContext('2d');
      const seedBtn = document.getElementById('seedBtn');
      const modeBtn = document.getElementById('modeBtn');
      const fractureBtn = document.getElementById('fractureBtn');
      const burstBtn = document.getElementById('burstBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const copyBtn = document.getElementById('copyBtn');
      const exportBtn = document.getElementById('exportBtn');
      const clearBtn = document.getElementById('clearBtn');
      const speedRange = document.getElementById('speedRange');
      const speedLabel = document.getElementById('speedLabel');
      const shearRange = document.getElementById('shearRange');
      const shearLabel = document.getElementById('shearLabel');
      const status = document.getElementById('status');
      const note = document.getElementById('note');

      const pointer = { x: -1, y: -1, down: false };
      const palette = ['#8ef2ff', '#c7afff', '#ffd67d', '#ff9df8', '#8afad8', '#ffe38f', '#a0b9ff'];
      const state = { mode: 'orbit', fracture: false };
      const nodes = [];
      const impulses = [];
      const seedMeta = { seed: 0, stateVersion: 1 };
      let width = 0;
      let height = 0;
      let dpr = Math.min(2, window.devicePixelRatio || 1);
      let rng = 0x8a8b_23c7;
      let running = true;
      let last = 0;
      let pendingCopy = false;
      let speed = 1.05;
      let shear = 1.3;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const wrap = (value, max) => {
        if (max <= 0) return value;
        if (value < 0) return value + max;
        if (value >= max) return value - max;
        return value;
      };

      const randomSeed = () => {
        if (window.crypto && window.crypto.getRandomValues) {
          const bytes = new Uint32Array(1);
          window.crypto.getRandomValues(bytes);
          return bytes[0] >>> 0;
        }
        return (Date.now() * 48271 + 1) >>> 0;
      };

      const reseed = (value) => {
        seedMeta.seed = value >>> 0;
        rng = (seedMeta.seed * 0x9E3779B9) >>> 0;
      };

      const rand = () => {
        rng = (rng * 1664525 + 1013904223) >>> 0;
        return rng / 0x100000000;
      };

      const randRange = (min, max) => min + rand() * (max - min);
      const formatState = (raw) => raw.toString(36).padStart(8, '0');

      const encodeState = (payload) => {
        const plain = encodeURIComponent(JSON.stringify(payload));
        const b64 = btoa(plain);
        return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      };

      const decodeState = (value) => {
        try {
          const fixed = value.replace(/-/g, '+').replace(/_/g, '/');
          const padded = fixed + '='.repeat((4 - fixed.length % 4) % 4);
          return JSON.parse(decodeURIComponent(atob(padded)));
        } catch (_error) {
          return null;
        }
      };

      const saveState = (payload) => {
        const params = new URLSearchParams(location.search);
        params.set('state', encodeState(payload));
        const next = new URL(location.href);
        next.search = params.toString();
        history.replaceState({}, '', next);
      };

      const parseState = () => {
        const raw = new URLSearchParams(location.search).get('state');
        if (!raw) return null;
        return decodeState(raw);
      };

      const resize = () => {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(1, Math.floor(rect.width));
        height = Math.max(1, Math.floor(rect.height));
        canvas.width = Math.max(1, Math.floor(width * dpr));
        canvas.height = Math.max(1, Math.floor(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      const makeNode = (forced = {}) => {
        const phase = rand() * Math.PI * 2;
        return {
          x: forced.x ?? randRange(0, width),
          y: forced.y ?? randRange(0, height),
          vx: (rand() - 0.5) * 1.2,
          vy: (rand() - 0.5) * 1.2,
          phase,
          radius: randRange(0.8, 2.9),
          hue: randRange(0, 360),
          spin: randRange(0.2, 1.2),
          seed: (rand() * 0xffffffff) >>> 0,
          life: randRange(0.4, 1),
          trail: [],
          weight: randRange(0.45, 1),
        };
      };

      const applyPayload = (payload) => {
        if (!payload || payload.v !== seedMeta.stateVersion) return false;
        reseed(payload.seed || randomSeed());
        state.mode = payload.mode === 'fracture' ? 'fracture' : 'orbit';
        state.fracture = Boolean(payload.fracture);
        speed = clamp(Number(payload.speed) || 1.05, 0.42, 2.3);
        shear = clamp(Number(payload.shear) || 1.3, 0.45, 3);
        nodes.length = 0;
        const sourceNodes = Array.isArray(payload.nodes) ? payload.nodes : [];
        for (const n of sourceNodes) {
          if (!n || typeof n !== 'object') continue;
          const nx = Number(n.x);
          const ny = Number(n.y);
          if (!Number.isFinite(nx) || !Number.isFinite(ny)) continue;
          nodes.push({
            x: wrap(nx, width),
            y: wrap(ny, height),
            vx: Number(n.vx) || 0,
            vy: Number(n.vy) || 0,
            phase: Number(n.phase) || rand() * Math.PI * 2,
            radius: clamp(Number(n.r) || 1.2, 0.35, 3.6),
            hue: Number(n.h) || randRange(0, 360),
            spin: clamp(Number(n.s) || 1, 0.2, 1.6),
            seed: Number(n.sd) >>> 0 || (rand() * 0xffffffff) >>> 0,
            life: clamp(Number(n.l) || rand(), 0.25, 1),
            trail: [],
            weight: clamp(Number(n.w) || 0.6, 0.25, 1.6),
          });
        }
        if (!nodes.length) {
          for (let i = 0; i < 88; i += 1) {
            nodes.push(makeNode());
          }
        }
        updateModeButtons();
        speedRange.value = String(speed);
        shearRange.value = String(shear);
        speedLabel.textContent = String(speed.toFixed(2));
        shearLabel.textContent = String(shear.toFixed(2));
        return true;
      };

      const currentPayload = () => {
        return {
          v: seedMeta.stateVersion,
          seed: seedMeta.seed >>> 0,
          mode: state.mode,
          fracture: state.fracture,
          speed: Number(speed.toFixed(3)),
          shear: Number(shear.toFixed(3)),
          nodes: nodes.map((node) => ({
            x: Number(node.x.toFixed(2)),
            y: Number(node.y.toFixed(2)),
            vx: Number(node.vx.toFixed(4)),
            vy: Number(node.vy.toFixed(4)),
            phase: Number(node.phase.toFixed(4)),
            r: Number(node.radius.toFixed(4)),
            h: Number(node.hue.toFixed(2)),
            s: Number(node.spin.toFixed(4)),
            sd: Number(node.seed >>> 0),
            l: Number(node.life.toFixed(3)),
            w: Number(node.weight.toFixed(3)),
          })),
        };
      };

      const updateModeButtons = () => {
        modeBtn.textContent = `mode: ${state.mode}`;
        fractureBtn.textContent = `fracture seams: ${state.fracture ? 'on' : 'off'}`;
        fractureBtn.setAttribute('aria-pressed', String(state.fracture));
        status.textContent = `seed ${formatState(seedMeta.seed)} • ${state.mode} • ${nodes.length} nodes`;
      };

      const injectImpulse = (x, y) => {
        for (let i = 0; i < 5; i += 1) {
          const angle = rand() * Math.PI * 2;
          const power = randRange(1.5, 3.5);
          const n = makeNode({ x, y });
          n.vx += Math.cos(angle) * power;
          n.vy += Math.sin(angle) * power;
          n.weight = randRange(0.85, 1.5);
          n.radius = randRange(2.2, 3.6);
          n.life = 1;
          impulses.push({
            x,
            y,
            r: 0,
            life: randRange(0.5, 1),
            peak: randRange(46, 82),
          });
          nodes.push(n);
          if (nodes.length > 160) {
            nodes.shift();
          }
        }
      };

      const step = (time) => {
        const dt = Math.min(36, time - last);
        last = time;
        if (!running) return requestAnimationFrame(step);

        const t = (time * 0.001) * speed;
        const baseNoise = shear * 0.008;
        const cx = width / 2;
        const cy = height / 2;
        const swirlScale = Math.min(width, height) * 0.21;
        const drift = state.mode === 'fracture' ? 1.6 : 1;
        const fractureThreshold = state.fracture ? Math.max(90, Math.min(width, height) * 0.2) : 0;

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(7, 6, 15, 0.16)';
        ctx.fillRect(0, 0, width, height);
        ctx.restore();

        ctx.globalCompositeOperation = 'lighter';
        for (let i = nodes.length - 1; i >= 0; i -= 1) {
          const node = nodes[i];
          const dx = node.x - cx;
          const dy = node.y - cy;
          const orbit = Math.atan2(dy, dx);
          const dist = Math.max(32, Math.hypot(dx, dy));
          const field = (Math.sin((node.seed * 0.0001) + orbit + (t * 0.001 * node.spin * drift))
            + Math.cos((dist * 0.012) - t * 0.004 * node.spin)) * baseNoise;
          const attract = state.mode === 'fracture' ? -0.22 : 0.14;

          node.vx += (-Math.sin(orbit) * (swirlScale / dist) * 0.00095 * drift);
          node.vy += (Math.cos(orbit) * (swirlScale / dist) * 0.00095 * drift);
          node.vx += Math.cos(t * 0.16 + node.phase) * field;
          node.vy += Math.sin(t * 0.14 + node.phase) * field;
          node.vx += (attract * (cx - node.x) / Math.max(180, dist * 2.3));
          node.vy += (attract * (cy - node.y) / Math.max(180, dist * 2.3));

          if (pointer.x >= 0 && pointer.y >= 0) {
            const px = node.x - pointer.x;
            const py = node.y - pointer.y;
            const pd = Math.hypot(px, py) || 1;
            const pull = state.fracture ? 95 : 36;
            const falloff = Math.max(0.1, 1 - (pd / pull));
            if (falloff > 0.02) {
              node.vx += (-px / pd) * (falloff * 0.004 * speed * drift * 4);
              node.vy += (-py / pd) * (falloff * 0.004 * speed * drift * 4);
            }
          }

          node.vx *= 0.985;
          node.vy *= 0.985;
          node.x = wrap(node.x + node.vx * dt * 0.06, width);
          node.y = wrap(node.y + node.vy * dt * 0.06, height);
          node.phase += 0.0024 * dt * speed * (node.spin + 0.45);
          node.life = Math.min(1, node.life + 0.0004 * dt);

          const drawSize = Math.max(0.2, node.radius * (node.weight + 0.5));
          const glow = `hsla(${node.hue}, 82%, 74%, ${0.12 + node.weight * 0.11})`;
          const line = `hsla(${node.hue}, 92%, 64%, ${0.09 + node.weight * 0.07})`;
          node.trail.push([node.x, node.y]);
          if (node.trail.length > 16) node.trail.shift();
          ctx.strokeStyle = line;
          ctx.lineWidth = Math.max(0.5, drawSize * 0.6);
          ctx.beginPath();
          for (let j = 0; j < node.trail.length; j += 1) {
            const p = node.trail[j];
            if (j === 0) ctx.moveTo(p[0], p[1]);
            else ctx.lineTo(p[0], p[1]);
          }
          ctx.stroke();

          ctx.beginPath();
          ctx.fillStyle = glow;
          ctx.arc(node.x, node.y, drawSize, 0, Math.PI * 2);
          ctx.fill();
        }

        if (state.fracture) {
          for (let i = 0; i < nodes.length; i += 2) {
            const node = nodes[i];
            const next = nodes[(i + 7) % nodes.length];
            const dx = node.x - next.x;
            const dy = node.y - next.y;
            const dist = Math.hypot(dx, dy);
            if (dist <= fractureThreshold && dist > 0) {
              const alpha = 0.03 + (1 - dist / fractureThreshold) * 0.17;
              ctx.strokeStyle = `hsla(${(node.hue + next.hue) * 0.5}, 85%, 66%, ${alpha})`;
              ctx.lineWidth = Math.max(0.35, (node.weight + next.weight) * 0.7);
              ctx.beginPath();
              ctx.moveTo(node.x, node.y);
              const midX = (node.x + next.x) * 0.5 + Math.cos(t * 0.002 + node.phase) * 8;
              const midY = (node.y + next.y) * 0.5 + Math.sin(t * 0.002 + next.phase) * 8;
              ctx.quadraticCurveTo(midX, midY, next.x, next.y);
              ctx.stroke();
            }
          }
        }

        const pulseColor = state.mode === 'fracture' ? '#ff91ff' : '#6ff6ff';
        for (const impulse of impulses) {
          impulse.r += dt * (state.mode === 'fracture' ? 0.75 : 0.52);
          impulse.life -= dt / (state.mode === 'fracture' ? 980 : 1180);
          const alpha = Math.max(0, impulse.life) * 0.45;
          if (alpha <= 0.01) continue;
          ctx.strokeStyle = `${pulseColor}${Math.round(alpha * 128).toString(16).padStart(2, '0')}`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(impulse.x, impulse.y, impulse.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        for (let i = impulses.length - 1; i >= 0; i -= 1) {
          if (impulses[i].life <= 0) impulses.splice(i, 1);
        }
        ctx.globalCompositeOperation = 'source-over';
        if (Number((performance.now() - (status.__last || performance.now())).toFixed(0)) >= 2200) {
          status.__last = performance.now();
          status.textContent = `seed ${formatState(seedMeta.seed)} • ${state.mode} • ${nodes.length} nodes`;
        }
        requestAnimationFrame(step);
      };

      const setMode = () => {
        state.mode = state.mode === 'orbit' ? 'fracture' : 'orbit';
        if (state.mode === 'fracture' && !state.fracture) {
          state.fracture = true;
        }
        updateModeButtons();
      };

      const copyLink = async () => {
        saveState(currentPayload());
        const share = new URL(location.href);
        status.textContent = 'copied share link to clipboard';
        try {
          await navigator.clipboard.writeText(share.toString());
          pendingCopy = true;
          return;
        } catch (_error) {
          pendingCopy = false;
        }
        window.prompt('Share this link:', share.toString());
      };

      const exportPng = () => {
        const a = document.createElement('a');
        a.download = `fracture-orbit-${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      const clearField = () => {
        for (let i = nodes.length - 1; i >= 0; i -= 1) {
          nodes.length = 0;
        }
        impulses.length = 0;
        for (let i = 0; i < 84; i += 1) nodes.push(makeNode());
        status.textContent = 'field cleared';
      };

      const init = () => {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        resize();
        const params = parseState();
        const started = applyPayload(params);
        if (!started) {
          reseed(randomSeed());
          nodes.length = 0;
          for (let i = 0; i < 88; i += 1) nodes.push(makeNode());
          for (let i = 0; i < 4; i += 1) injectImpulse(width * 0.5, height * 0.5);
          updateModeButtons();
        } else {
          status.textContent = `loaded state seed ${formatState(seedMeta.seed)} • ${state.mode}`;
        }

        seedBtn.addEventListener('click', () => {
          reseed(randomSeed());
          clearField();
          status.textContent = `new seed ${formatState(seedMeta.seed)} live`;
        });
        modeBtn.addEventListener('click', setMode);
        fractureBtn.addEventListener('click', () => {
          state.fracture = !state.fracture;
          updateModeButtons();
          status.textContent = state.fracture ? 'fracture seams on' : 'fracture seams off';
        });
        burstBtn.addEventListener('click', () => {
          const cx = width * Math.random();
          const cy = height * Math.random();
          injectImpulse(cx, cy);
          status.textContent = 'burst dropped';
        });
        pauseBtn.addEventListener('click', () => {
          running = !running;
          pauseBtn.setAttribute('aria-pressed', String(!running));
          pauseBtn.textContent = `pause: ${running ? 'off' : 'on'}`;
          if (running) {
            status.textContent = 'resumed';
            requestAnimationFrame((time) => {
              last = time;
              requestAnimationFrame(step);
            });
          }
        });
        copyBtn.addEventListener('click', copyLink);
        exportBtn.addEventListener('click', exportPng);
        clearBtn.addEventListener('click', clearField);

        speedRange.addEventListener('input', () => {
          speed = clamp(Number(speedRange.value), 0.42, 2.3);
          speedLabel.textContent = speed.toFixed(2);
        });
        shearRange.addEventListener('input', () => {
          shear = clamp(Number(shearRange.value), 0.45, 3);
          shearLabel.textContent = shear.toFixed(2);
        });

        const updatePointer = (event) => {
          const rect = canvas.getBoundingClientRect();
          const evt = event.touches ? event.touches[0] : event;
          if (!evt) return;
          pointer.x = evt.clientX - rect.left;
          pointer.y = evt.clientY - rect.top;
          if (pointer.down) {
            injectImpulse(pointer.x, pointer.y);
          }
        };

        canvas.addEventListener('pointerdown', (event) => {
          pointer.down = true;
          updatePointer(event);
          injectImpulse(pointer.x, pointer.y);
          status.textContent = 'orbit stitched';
        });
        canvas.addEventListener('pointermove', updatePointer);
        canvas.addEventListener('pointerup', () => {
          pointer.down = false;
        });
        canvas.addEventListener('pointerleave', () => {
          pointer.x = -1;
          pointer.y = -1;
          pointer.down = false;
        });
        window.addEventListener('resize', resize);
        window.addEventListener('blur', () => {
          pointer.down = false;
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            pendingCopy = false;
          }
        });

        requestAnimationFrame((time) => {
          last = time;
          requestAnimationFrame(step);
        });
      };

      init();
    })();
  </script>
</body>
</html>
