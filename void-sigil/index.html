<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void Sigil</title>
    <meta
      name="description"
      content="Void Sigil is a pointer-tethered sigil field where particles weave and dissolve into luminous loops."
    />
    <style>
      :root {
        --bg: #080612;
        --ink: #f0e8ff;
        --muted: #b8a6ff;
        --panel: #160e33;
        --line: #88f0ff;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at 20% 10%, #19113a, #090611 64%, var(--bg) 100%);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .ui {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        right: 0.75rem;
        z-index: 5;
        pointer-events: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .panel {
        pointer-events: auto;
        border: 1px solid #34226b;
        background: color-mix(in oklab, var(--panel), #000 22%);
        border-radius: 0.8rem;
        padding: 0.5rem 0.7rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
      }

      button,
      .link,
      .status {
        border-radius: 999px;
        border: 1px solid #5b42a9;
        padding: 0.34rem 0.7rem;
        background: #1b1442;
        color: var(--ink);
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }

      button,
      .link {
        cursor: pointer;
        text-decoration: none;
        font-weight: 700;
      }

      button:hover,
      .link:hover {
        border-color: #9b87ff;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: #d6cff8;
        font-size: 0.74rem;
      }

      input[type='range'] {
        width: 140px;
      }

      .status {
        max-width: 58ch;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .return {
        position: fixed;
        right: 0.75rem;
        bottom: 0.75rem;
        z-index: 5;
        background: #151032;
      }

      @media (max-width: 700px) {
        .ui {
          top: 0.55rem;
          left: 0.55rem;
          right: 0.55rem;
        }

        .panel {
          width: 100%;
        }

        input[type='range'] {
          width: 110px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="sigil"></canvas>

    <div class="ui">
      <div class="panel">
        <button id="pause">pause: off</button>
        <button id="reseed">reseed</button>
        <button id="clear">clear</button>
        <button id="copy">copy link</button>
        <button id="save">save frame</button>
        <label>
          density
          <input id="density" type="range" min="40" max="260" step="20" value="130" />
        </label>
      </div>
      <div class="panel">
        <span class="status" id="status">ready to be haunted</span>
      </div>
    </div>

    <a class="link return" href="../" aria-label="return home">return home</a>

    <script>
      const canvas = document.getElementById('sigil');
      const ctx = canvas.getContext('2d');
      const pauseBtn = document.getElementById('pause');
      const reseedBtn = document.getElementById('reseed');
      const clearBtn = document.getElementById('clear');
      const copyBtn = document.getElementById('copy');
      const saveBtn = document.getElementById('save');
      const densityRange = document.getElementById('density');
      const status = document.getElementById('status');

      const params = new URLSearchParams(location.search);
      const initialSeed = params.get('seed') ? Number.parseInt(params.get('seed'), 16) || 0x6f5e10 : (Date.now() & 0xffffffff);

      let seed = initialSeed >>> 0;
      let running = true;
      let pointer = { x: 0, y: 0, active: false, vx: 0, vy: 0 };
      let last = 0;
      let particles = [];
      const palette = ['#8deeff', '#c89aff', '#ff9bf6', '#fff7a8', '#9dffe8', '#b8e4ff', '#e2d2ff'];

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const rand = () => {
        seed ^= (seed << 13) >>> 0;
        seed ^= seed >>> 17;
        seed ^= (seed << 5) >>> 0;
        return ((seed >>> 0) % 2147483648) / 2147483648;
      };

      const hashToHex = (n) => n.toString(16).padStart(8, '0');
      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      const setStatus = (text) => {
        status.textContent = text;
      };

      const spawn = (x, y, count = 6) => {
        const density = Number.parseInt(densityRange.value, 10);
        const spawnAt = density / 2;
        for (let i = 0; i < count; i += 1) {
          const age = rand() * 120;
          const angle = rand() * Math.PI * 2;
          const speed = 0.4 + rand() * 2.2;
          particles.push({
            x,
            y,
            px: x,
            py: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            hue: Math.floor(rand() * palette.length),
            life: 280 + Math.floor(rand() * 240),
            t: age + spawnAt,
            mass: 0.22 + rand() * 0.8,
          });
        }
      };

      const reseed = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        particles = [];
        for (let i = 0; i < 180; i += 1) {
          const x = rand() * canvas.clientWidth;
          const y = rand() * canvas.clientHeight;
          particles.push({
            x,
            y,
            px: x,
            py: y,
            vx: (rand() - 0.5) * 2,
            vy: (rand() - 0.5) * 2,
            hue: Math.floor(rand() * palette.length),
            life: 240 + Math.floor(rand() * 280),
            t: rand() * 260,
            mass: 0.22 + rand() * 0.8,
          });
        }
      };

      const step = () => {
        if (!running) {
          requestAnimationFrame(step);
          return;
        }

        ctx.fillStyle = 'rgba(8,6,18,0.12)';
        ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

        const now = performance.now();
        const dt = clamp((now - last) / 16, 0.25, 3);
        last = now;

        const w = canvas.clientWidth;
        const h = canvas.clientHeight;

        particles.forEach((p) => {
          p.t += dt * (0.35 + p.mass);

          const n1 = Math.sin((p.t + p.mass * 40) * 0.015) * 0.8;
          const n2 = Math.cos((p.t * 0.013) + p.mass * 30) * 0.6;
          const cursorX = pointer.active ? (pointer.x - w / 2) * 0.001 : 0;
          const cursorY = pointer.active ? (pointer.y - h / 2) * 0.001 : 0;

          const ax = n1 + cursorX * 0.7 + Math.sin(p.t * 0.01 + p.mass * 50) * 0.2;
          const ay = n2 + cursorY * 0.7 + Math.cos(p.t * 0.013 + p.mass * 24) * 0.2;

          p.vx = p.vx * 0.995 + ax * 0.22;
          p.vy = p.vy * 0.995 + ay * 0.22;

          p.px = p.x;
          p.py = p.y;
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          if (p.x < 0) {
            p.x = w;
            p.px = 0;
          } else if (p.x > w) {
            p.x = 0;
            p.px = w;
          }
          if (p.y < 0) {
            p.y = h;
            p.py = 0;
          } else if (p.y > h) {
            p.y = 0;
            p.py = h;
          }

          p.life -= dt * 0.25;
          if (p.life <= 0) {
            p.life = 280 + Math.floor(rand() * 280);
            p.mass = 0.22 + rand() * 0.8;
            p.hue = Math.floor(rand() * palette.length);
            p.x = rand() * w;
            p.y = rand() * h;
            p.px = p.x;
            p.py = p.y;
          }

          const alpha = clamp((p.life / 320) * 0.8, 0.06, 0.9);
          ctx.strokeStyle = palette[p.hue] + '55';
          ctx.fillStyle = palette[p.hue];
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineWidth = 1 + p.mass;
          ctx.beginPath();
          ctx.moveTo(p.px, p.py);
          ctx.lineTo(p.x, p.y);
          ctx.globalAlpha = alpha;
          ctx.stroke();

          if (rand() > 0.993) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.2 + p.mass, 0, Math.PI * 2);
            ctx.globalAlpha = alpha * 0.8;
            ctx.fill();
          }
        });

        ctx.globalCompositeOperation = 'source-over';
        setStatus(`particles: ${particles.length} · seed: ${hashToHex(seed)} · ${running ? 'running' : 'paused'} · density: ${densityRange.value}`);
        pointer.vx = 0;
        pointer.vy = 0;
        requestAnimationFrame(step);
      };

      const copyLink = () => {
        const link = new URL(location.href);
        link.searchParams.set('seed', hashToHex(seed));
        navigator.clipboard?.writeText(link.toString()).then(() => {
          setStatus(`copied ${link.toString()}`);
        });
      };

      const saveFrame = () => {
        const link = document.createElement('a');
        link.download = `void-sigil-${hashToHex(seed)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        setStatus('saved frame');
      };

      const clearCanvas = () => {
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        setStatus('cleared');
      };

      const updatePause = () => {
        running = !running;
        pauseBtn.textContent = running ? 'pause: off' : 'pause: on';
      };

      const updatePointer = (x, y) => {
        pointer.x = x;
        pointer.y = y;
        pointer.active = true;
        spawn(x, y, 4);
      };

      canvas.addEventListener('pointerdown', (event) => {
        updatePointer(event.offsetX, event.offsetY);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (event.pressure === 0 && !pointer.active) return;
        if (!event.buttons) return;
        updatePointer(event.offsetX, event.offsetY);
      });

      canvas.addEventListener('pointerup', () => {
        pointer.active = false;
      });

      canvas.addEventListener('pointercancel', () => {
        pointer.active = false;
      });

      window.addEventListener('resize', resize);

      pauseBtn.addEventListener('click', updatePause);
      reseedBtn.addEventListener('click', () => {
        reseed();
        setStatus('reseeded');
      });
      clearBtn.addEventListener('click', clearCanvas);
      copyBtn.addEventListener('click', copyLink);
      saveBtn.addEventListener('click', saveFrame);

      resize();
      reseed();
      last = performance.now();
      requestAnimationFrame(step);
      setStatus('void sigil breathing');
    </script>
  </body>
</html>
