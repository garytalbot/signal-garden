<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>void echo</title>
  <meta name="description" content="Void Echo is a tiny signal-garden micro-oracle. Click to summon a short ritual prompt and draw a ripple." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060f;
      --ink: #dff7ff;
      --muted: #9eb4ff;
      --line: #89dbff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 15%, #12162a 0%, var(--bg) 55%, #020309 100%);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    body { position: relative; }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .panel {
      position: fixed;
      left: 0.7rem;
      right: 0.7rem;
      top: 0.7rem;
      z-index: 2;
      display: grid;
      gap: 0.55rem;
      max-width: 46ch;
      background: #0d1233cc;
      border: 1px solid #32407d;
      padding: 0.7rem;
      backdrop-filter: blur(3px);
    }

    h1 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--line);
    }

    #prompt {
      margin: 0;
      color: #dbe7ff;
      font-size: 0.9rem;
      line-height: 1.3;
      min-height: 2.6rem;
    }

    .tiny {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .row {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button, a {
      border: 1px solid #355f9f;
      background: #101833;
      color: var(--ink);
      padding: 0.4rem 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.78rem;
    }

    button:hover, a:hover { color: var(--line); }
  </style>
</head>
<body>
  <canvas id="echo" aria-hidden="true"></canvas>
  <section class="panel" aria-live="polite">
    <h1>void echo</h1>
    <p id="prompt">Tap the field. The prompt appears from the hush.</p>
    <p class="tiny">Every tap opens one line of the oracle.</p>
    <div class="row">
      <button id="spark" type="button">draw oracle</button>
      <button id="clear" type="button">clear</button>
      <a href="../" aria-label="Return to signal garden index">back</a>
    </div>
  </section>

  <script>
    const prompts = [
      "Listen for one phrase that never needed to be said.",
      "Name a fear, then drop the last letter.",
      "Ask: what is this signal trying to remember?",
      "Trace the shape of your next decision in the air.",
      "What part of the room echoes you back?",
      "Write a blessing to the thing that interrupts you."
    ];

    const canvas = document.getElementById('echo');
    const prompt = document.getElementById('prompt');
    const sparkBtn = document.getElementById('spark');
    const clearBtn = document.getElementById('clear');
    const ctx = canvas.getContext('2d');
    const ripples = [];
    let w = 0;
    let h = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      w = Math.floor(window.innerWidth * dpr);
      h = Math.floor(window.innerHeight * dpr);
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function cast(x, y, text) {
      prompt.textContent = text;
      for (let i = 0; i < 18; i++) {
        ripples.push({
          x,
          y,
          radius: 1 + i * 2,
          life: 1,
          drift: (Math.random() - 0.5) * 0.6,
          phase: Math.random() * Math.PI * 2,
          speed: 0.3 + Math.random() * 0.5,
          weight: 0.8 + Math.random() * 0.8
        });
      }
    }

    function step() {
      ctx.fillStyle = 'rgba(5, 6, 15, 0.08)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += r.speed;
        r.life *= 0.99;
        r.phase += 0.08;
        const alpha = Math.max(0, r.life - r.radius * 0.004);
        if (alpha <= 0) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.phase);
        ctx.strokeStyle = `rgba(137, 219, 255, ${alpha.toFixed(3)})`;
        ctx.lineWidth = r.weight * 0.5;
        ctx.beginPath();
        ctx.arc(r.drift, 0, r.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(step);
    }
    step();

    function pickPrompt() {
      return prompts[Math.floor(Math.random() * prompts.length)];
    }

    function invoke(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      cast(x, y, pickPrompt());
    }

    canvas.addEventListener('pointerdown', invoke);
    sparkBtn.addEventListener('click', () => cast(Math.random() * window.innerWidth, Math.random() * window.innerHeight, pickPrompt()));
    clearBtn.addEventListener('click', () => {
      ripples.length = 0;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      prompt.textContent = 'Field cleared. Tap again to resume.';
    });
  </script>
</body>
</html>
