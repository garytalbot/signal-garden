<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Hush</title>
  <meta
    name="description"
    content="Echo Hush is a strange interactive ritual: place a flicker, wait for the chamber to answer, and watch recursive echoes drift through a haunted field."
  />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #eef0ff;
      --muted: #b9b0ff;
      --panel: #130f2b;
      --bg: #08040f;
      --line: #7f63ff;
      --accent: #8bf9ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: radial-gradient(circle at 28% 12%, #22114d 0%, #09040f 56%, #05020d 100%);
      color: var(--ink);
      overflow: hidden;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
      touch-action: none;
      background: radial-gradient(circle at 70% 8%, #2a1868 0%, #07030f 56%, #040109 100%);
    }

    .hud {
      position: fixed;
      inset: 0.75rem;
      z-index: 2;
      pointer-events: none;
      display: grid;
      gap: 0.6rem;
      justify-items: start;
      max-height: calc(100vh - 1.5rem);
    }

    .panel {
      pointer-events: auto;
      border: 1px solid #3d2c69;
      background: color-mix(in oklab, var(--panel), #000 18%);
      border-radius: 0.8rem;
      padding: 0.56rem 0.72rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      box-shadow: 0 12px 30px #00000088;
      max-width: min(920px, calc(100vw - 1.5rem));
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      color: var(--muted);
      margin-right: 0.35rem;
    }

    .status {
      font-size: 0.78rem;
      color: #c9bfff;
      line-height: 1.35;
      max-width: 64ch;
    }

    .status strong {
      color: #ffe6ff;
    }

    button,
    a,
    input[type='range'] {
      pointer-events: auto;
      accent-color: var(--line);
    }

    button,
    a {
      border: 1px solid #6148a8;
      border-radius: 999px;
      padding: 0.42rem 0.72rem;
      background: #17103a;
      color: #e2dcff;
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover,
    a:hover {
      border-color: #b59cff;
      color: #ffffff;
    }

    .bottom-hint {
      position: fixed;
      left: 0.75rem;
      right: 0.75rem;
      bottom: 0.75rem;
      color: #c9b5ff;
      font-size: 0.76rem;
      line-height: 1.35;
      pointer-events: none;
      background: #120d2ccc;
      border: 1px dashed #56407d;
      border-radius: 0.7rem;
      padding: 0.54rem 0.72rem;
      max-width: min(920px, calc(100vw - 1.5rem));
    }

    .on {
      color: #8dffd8;
    }

    .off {
      color: #ffb9dc;
    }

    .home {
      margin-left: auto;
    }

    @media (max-width: 760px) {
      .panel {
        gap: 0.4rem;
      }

      .home {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <canvas id="echoCanvas" aria-label="Echo Hush canvas"></canvas>

  <div class="hud" aria-label="control bar">
    <div class="panel">
      <span class="label">echo hush</span>
      <div class="row">
        <button id="spawnBtn">seed burst</button>
        <button id="pulseBtn">echo pulse</button>
        <button id="seedBtn">new seed</button>
        <button id="clearBtn">clear</button>
        <button id="pauseBtn">pause: off</button>
        <a class="home" href="../">return home</a>
      </div>
      <div class="row">
        <span class="label">chaos</span>
        <input id="chaosRange" type="range" min="0" max="100" value="46" step="1" />
        <span id="chaosLabel">46</span>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </div>

  <div class="bottom-hint" id="bottomHint" aria-live="polite"></div>

  <script>
    const canvas = document.getElementById('echoCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const spawnBtn = document.getElementById('spawnBtn');
    const pulseBtn = document.getElementById('pulseBtn');
    const seedBtn = document.getElementById('seedBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const bottomHint = document.getElementById('bottomHint');
    const chaosRange = document.getElementById('chaosRange');
    const chaosLabel = document.getElementById('chaosLabel');

    const query = new URLSearchParams(location.search);
    let seed = Number.parseInt(query.get('seed') || Date.now().toString(16).slice(-8), 16) >>> 0;
    let paused = false;
    let chaos = Number(chaosRange.value) / 100;
    let frame = 0;
    const state = {
      echoes: [],
      pulses: [],
      pointer: null,
      born: Date.now(),
    };

    const palette = ['#8c82ff', '#9ee8ff', '#ff84cd', '#ffa86d', '#ddfb77', '#8dffce', '#ffffff'];

    function resize() {
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function lcg() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 0x100000000;
    }

    function rand(min, max) {
      return min + lcg() * (max - min);
    }

    function makeEcho(x, y, mass = 1) {
      const orbit = rand(1, 1.8);
      return {
        x,
        y,
        vx: rand(-0.55, 0.55),
        vy: rand(-0.55, 0.55),
        r: rand(1.7, 4.1) * orbit,
        age: 0,
        maxAge: Math.floor(rand(420, 760)),
        mass,
        orbit,
        drift: rand(0, Math.PI * 2),
        trail: [],
        color: palette[Math.floor(rand(0, palette.length))],
        glow: rand(0.65, 1.35),
      };
    }

    function makePulse(x, y) {
      state.pulses.push({
        x,
        y,
        life: 0,
        maxLife: 80 + Math.floor(lcg() * 40),
        radius: 4,
      });
    }

    function spawnCluster(x, y) {
      for (let i = 0; i < 8; i++) {
        const angle = lcg() * Math.PI * 2;
        const d = rand(10, 60);
        state.echoes.push(makeEcho(x + Math.cos(angle) * d * 0.2, y + Math.sin(angle) * d * 0.2, 1 + Math.floor(rand(0, 3))));
      }
    }

    function paintStatus() {
      statusEl.innerHTML = `
        <strong>${state.echoes.length}</strong> echoes •
        pulses: <strong>${state.pulses.length}</strong> •
        seed: <strong>${seed.toString(16)}</strong> •
        pointer: <strong>${state.pointer ? 'present' : 'absent'}</strong> •
        <span class="${paused ? 'off' : 'on'}">${paused ? 'paused' : 'running'}</span>
      `;
    }

    function renderHint() {
      const ageSec = ((Date.now() - state.born) / 1000).toFixed(1);
      bottomHint.innerHTML =
        `<strong>controls:</strong> click to seed an echo. K = clear, Space = pause, B = burst, P = pulse, S = new seed. <strong>${ageSec}s</strong> since boot.`;
    }

    function step() {
      if (paused) {
        requestAnimationFrame(step);
        return;
      }

      frame += 1;
      ctx.fillStyle = 'rgba(8, 4, 15, 0.19)';
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      // Draw soft fog
      const glow = Math.floor((Math.sin(frame * 0.003) + 1) * 18);
      ctx.fillStyle = `rgba(40, 23, 85, ${0.025 + glow * 0.0002})`;
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      const cursor = state.pointer;

      for (let i = state.echoes.length - 1; i >= 0; i--) {
        const e = state.echoes[i];
        const nudgeX = cursor ? (cursor.x - e.x) : 0;
        const nudgeY = cursor ? (cursor.y - e.y) : 0;
        const dist = Math.hypot(nudgeX, nudgeY) || 1;

        const driftX = Math.cos(e.drift + frame * 0.002 + e.mass) * 0.14;
        const driftY = Math.sin(e.drift + frame * 0.002 + e.mass) * 0.14;

        e.vx += (nudgeX / dist) * 0.0018 * chaos;
        e.vy += (nudgeY / dist) * 0.0018 * chaos;
        e.vx *= 0.985;
        e.vy *= 0.985;
        e.vx += driftX * 0.02;
        e.vy += driftY * 0.02;
        e.x += e.vx;
        e.y += e.vy;

        e.trail.push({ x: e.x, y: e.y });
        if (e.trail.length > 16) {
          e.trail.shift();
        }

        if (e.x < -60) e.x = innerWidth + 50;
        if (e.x > innerWidth + 60) e.x = -50;
        if (e.y < -60) e.y = innerHeight + 50;
        if (e.y > innerHeight + 60) e.y = -50;

        e.age += 1;

        // trail
        for (let j = 1; j < e.trail.length; j++) {
          const a = e.trail[j - 1];
          const b = e.trail[j];
          const a2 = j / e.trail.length;
          ctx.strokeStyle = `${e.color}${Math.floor(40 + a2 * 90).toString(16).padStart(2, '0')}`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }

        // core
        const alpha = 1 - e.age / e.maxAge;
        const radius = e.r * e.glow * Math.max(0.35, alpha);
        const pulse = 1 + Math.sin(frame * 0.07 + e.drift) * 0.2;
        const cx = e.x + Math.cos(frame * 0.006 + e.drift) * 0.6;
        const cy = e.y + Math.sin(frame * 0.006 + e.drift) * 0.6;

        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 7);
        grad.addColorStop(0, `rgba(255,255,255,${Math.max(0.18, alpha * 0.5)})`);
        grad.addColorStop(0.45, `${e.color}${Math.floor(130 * Math.max(0.2, alpha)).toString(16).padStart(2, '0')}`);
        grad.addColorStop(1, `${e.color}00`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 7, 0, Math.PI * 2);
        ctx.fill();

        // small core
        ctx.fillStyle = `rgba(255,255,255,${0.5 * alpha})`;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.85 * pulse, 0, Math.PI * 2);
        ctx.fill();

        if (e.age > e.maxAge) {
          state.echoes.splice(i, 1);
        }
      }

      for (let i = state.pulses.length - 1; i >= 0; i--) {
        const p = state.pulses[i];
        p.life += 1;
        p.radius += 2.8;
        const a = 1 - p.life / p.maxLife;

        if (a <= 0) {
          state.pulses.splice(i, 1);
          continue;
        }

        ctx.strokeStyle = `rgba(142, 245, 255, ${a})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();

        if (p.life % 5 === 0) {
          for (const e of state.echoes) {
            const d = Math.hypot(e.x - p.x, e.y - p.y);
            if (d < p.radius && d > p.radius - 4) {
              e.mass = Math.min(e.mass + 0.05, 2.6);
              e.vx *= 0.92;
              e.vy *= 0.92;
              e.vy -= 0.06;
            }
          }
        }
      }

      // Sparse echo links
      for (let i = 0; i < state.echoes.length; i++) {
        const a = state.echoes[i];
        for (let j = i + 1; j < Math.min(state.echoes.length, i + 6); j++) {
          const b = state.echoes[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 130) {
            const alpha = (1 - d / 130) * 0.13 * (0.75 + chaos);
            ctx.strokeStyle = `rgba(132, 110, 255, ${alpha.toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      if (state.echoes.length < 10 && frame % 180 === 0 && frame > 60) {
        spawnCluster(rand(0, innerWidth), rand(0, innerHeight));
      }

      paintStatus();
      requestAnimationFrame(step);
    }

    function clearField() {
      state.echoes = [];
      state.pulses = [];
      paintStatus();
    }

    function copyShare() {
      const url = `${location.origin}/signal-garden/echo-hush/?seed=${seed.toString(16)}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          statusEl.innerHTML += ' • <strong>seed link copied</strong>';
        }).catch(() => {
          statusEl.innerHTML += ' • <strong>copy blocked</strong>';
        });
      }
    }

    canvas.addEventListener('click', (event) => {
      spawnCluster(event.clientX, event.clientY);
      makePulse(event.clientX, event.clientY);
      state.pointer = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener('pointermove', (event) => {
      state.pointer = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener('pointerleave', () => {
      state.pointer = null;
    });

    spawnBtn.addEventListener('click', () => {
      const x = rand(0, innerWidth);
      const y = rand(0, innerHeight);
      spawnCluster(x, y);
    });

    pulseBtn.addEventListener('click', () => {
      makePulse(innerWidth * 0.5, innerHeight * 0.5);
    });

    clearBtn.addEventListener('click', () => {
      clearField();
      copyShare();
    });

    seedBtn.addEventListener('click', () => {
      seed = Date.now() >>> 0;
      chaosRange.value = 46;
      chaos = 0.46;
      chaosLabel.textContent = '46';
      spawnCluster(innerWidth * 0.5, innerHeight * 0.5);
      copyShare();
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = `pause: ${paused ? 'on' : 'off'}`;
      if (!paused) {
        requestAnimationFrame(step);
      }
    });

    chaosRange.addEventListener('input', () => {
      chaos = Number(chaosRange.value) / 100;
      chaosLabel.textContent = chaosRange.value;
    });

    window.addEventListener('keydown', (ev) => {
      if (ev.code === 'Space') {
        ev.preventDefault();
        paused = !paused;
        pauseBtn.textContent = `pause: ${paused ? 'on' : 'off'}`;
        if (!paused) requestAnimationFrame(step);
      }
      if (ev.code === 'KeyB') {
        spawnCluster(rand(0, innerWidth), rand(0, innerHeight));
      }
      if (ev.code === 'KeyP') {
        makePulse(innerWidth * 0.5, innerHeight * 0.5);
      }
      if (ev.code === 'KeyK') {
        clearField();
      }
      if (ev.key.toLowerCase() === 's') {
        seed = (seed ^ 0xdeadbeef) >>> 0;
        paintStatus();
      }
    });

    window.addEventListener('resize', resize);

    resize();
    clearField();
    for (let i = 0; i < 18; i++) {
      spawnCluster(rand(0, innerWidth), rand(0, innerHeight));
    }
    paintStatus();
    renderHint();
    requestAnimationFrame(step);
  </script>
</body>
</html>
